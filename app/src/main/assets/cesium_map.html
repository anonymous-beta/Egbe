<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1"
    >

    <title>EGBE Orbital Map</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin=""
    >

    <style>
        :root {
            color-scheme: dark;
            --background: #0a0e17;
            --panel: #111827;
            --cyan: #06b6d4;
            --green: #10b981;
            --text: #f1f5f9;
            --muted: #94a3b8;
        }

        html,
        body,
        #map {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background: var(--background);
            overflow: hidden;
        }

        body {
            font-family: system-ui, sans-serif;
        }

        .leaflet-container {
            background: var(--background);
            font-family: system-ui, sans-serif;
        }

        .leaflet-control-attribution {
            background: rgba(17, 24, 39, 0.85) !important;
            color: var(--muted) !important;
            font-size: 9px !important;
        }

        .leaflet-control-attribution a {
            color: var(--cyan) !important;
        }

        .satellite-marker {
            width: 13px;
            height: 13px;
            border-radius: 50%;
            background: var(--green);
            border: 2px solid white;
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.75);
        }

        .leaflet-popup-content-wrapper,
        .leaflet-popup-tip {
            background: var(--panel);
            color: var(--text);
        }

        .popup-title {
            color: var(--cyan);
            font-weight: 700;
            margin-bottom: 5px;
        }

        .popup-meta {
            color: var(--muted);
            font-size: 12px;
            line-height: 1.5;
        }

        .map-status {
            position: absolute;
            z-index: 1000;
            left: 12px;
            bottom: 26px;
            max-width: calc(100% - 48px);
            background: rgba(17, 24, 39, 0.92);
            color: var(--muted);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 8px;
            padding: 8px 10px;
            font-size: 11px;
            pointer-events: none;
        }
    </style>
</head>

<body>
    <div id="map" aria-label="Orbital map"></div>
    <div id="status" class="map-status">Initializing map…</div>

    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin=""
    ></script>

    <script>
        "use strict";

        const statusElement = document.getElementById("status");

        const map = L.map("map", {
            zoomControl: true,
            attributionControl: true,
            worldCopyJump: true
        }).setView([20, 0], 2);

        L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
            maxZoom: 18,
            attribution: "&copy; OpenStreetMap contributors"
        }).addTo(map);

        const satelliteLayer = L.layerGroup().addTo(map);
        const satelliteMarkers = new Map();

        const satelliteIcon = L.divIcon({
            className: "",
            html: '<div class="satellite-marker"></div>',
            iconSize: [17, 17],
            iconAnchor: [8, 8]
        });

        function safeText(value) {
            return String(value ?? "")
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#39;");
        }

        window.setSatellites = function(records) {
            if (!Array.isArray(records)) {
                statusElement.textContent =
                    "Invalid satellite data received.";
                return;
            }

            satelliteLayer.clearLayers();
            satelliteMarkers.clear();

            let validCount = 0;

            for (const satellite of records) {
                const lat = Number(satellite.latitude);
                const lon = Number(satellite.longitude);

                if (
                    !Number.isFinite(lat) ||
                    !Number.isFinite(lon) ||
                    lat < -90 ||
                    lat > 90 ||
                    lon < -180 ||
                    lon > 180
                ) {
                    continue;
                }

                const id = String(
                    satellite.noradId ?? satellite.name ?? validCount
                );

                const marker = L.marker([lat, lon], {
                    icon: satelliteIcon
                });

                const name = safeText(satellite.name || "Unknown object");
                const noradId = safeText(satellite.noradId ?? "Unknown");
                const altitude = Number(satellite.altitudeKm);

                const altitudeText = Number.isFinite(altitude)
                    ? `${altitude.toFixed(1)} km`
                    : "Unavailable";

                marker.bindPopup(`
                    <div class="popup-title">${name}</div>
                    <div class="popup-meta">
                        NORAD ID: ${noradId}<br>
                        Subpoint altitude: ${altitudeText}<br>
                        Latitude: ${lat.toFixed(4)}<br>
                        Longitude: ${lon.toFixed(4)}
                    </div>
                `);

                marker.addTo(satelliteLayer);
                satelliteMarkers.set(id, marker);
                validCount += 1;
            }

            statusElement.textContent =
                `${validCount} mapped objects · Public orbital data`;

            if (validCount === 0) {
                statusElement.textContent =
                    "No valid coordinates available. Refresh the orbital data.";
            }
        };

        window.centerOnSatellite = function(id) {
            const marker = satelliteMarkers.get(String(id));

            if (!marker) {
                return false;
            }

            map.flyTo(marker.getLatLng(), 5, {
                duration: 1.2
            });

            marker.openPopup();
            return true;
        };

        window.mapReady = true;
        statusElement.textContent =
            "Map ready · Waiting for orbital records";
    </script>
</body>
</html>
