<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cesium.com/downloads/cesiumjs/releases/1.110/Build/Cesium/Cesium.js"></script>
    <link href="https://cesium.com/downloads/cesiumjs/releases/1.110/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #0a0e17; overflow: hidden; }
        #cesiumContainer { width: 100%; height: 100%; }
        .cesium-viewer-bottom { display: none !important; }
        .cesium-viewer-toolbar { display: none !important; }
        .cesium-viewer-animationContainer { display: none !important; }
        .cesium-viewer-timelineContainer { display: none !important; }
    </style>
</head>
<body>
    <div id="cesiumContainer"></div>
    <script>
        Cesium.Ion.defaultAccessToken = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiJlYWE4OWUxMy0wY2ZjLTRkMDAtYjAzNy1mMTJkNTM3MGM0ZjAiLCJpZCI6NjQwNDUsImlhdCI6MTY4ODQ0MzQ3MH0.LT5Jt7-8xL6wA7L0z1d3m5k8p2q7r4t6y9u1i3o5p7q';
        
        const viewer = new Cesium.Viewer('cesiumContainer', {
            terrainProvider: Cesium.createWorldTerrain(),
            baseLayerPicker: false,
            geocoder: false,
            homeButton: false,
            sceneModePicker: false,
            navigationHelpButton: false,
            animation: false,
            timeline: false,
            fullscreenButton: false,
            skyAtmosphere: true,
            shadows: true
        });
        
        viewer.scene.globe.baseColor = Cesium.Color.fromCssColorString('#0a0e17');
        viewer.scene.globe.enableLighting = true;
        viewer.scene.globe.depthTestAgainstTerrain = true;
        
        const imageryProvider = new Cesium.IonImageryProvider({ assetId: 2 });
        viewer.imageryLayers.addImageryProvider(imageryProvider);
        
        let targetEntity = null;
        
        function flyToTarget(lat, lon, accuracy) {
            if (targetEntity) viewer.entities.remove(targetEntity);
            
            targetEntity = viewer.entities.add({
                position: Cesium.Cartesian3.fromDegrees(lon, lat, 0),
                point: { pixelSize: 16, color: Cesium.Color.RED, outlineColor: Cesium.Color.WHITE, outlineWidth: 2 },
                ellipse: {
                    semiMinorAxis: accuracy,
                    semiMajorAxis: accuracy,
                    material: Cesium.Color.RED.withAlpha(0.15),
                    outline: true,
                    outlineColor: Cesium.Color.RED,
                    outlineWidth: 1
                },
                label: {
                    text: 'TARGET',
                    font: 'bold 14px monospace',
                    fillColor: Cesium.Color.RED,
                    outlineColor: Cesium.Color.BLACK,
                    outlineWidth: 2,
                    verticalOrigin: Cesium.VerticalOrigin.BOTTOM,
                    pixelOffset: new Cesium.Cartesian2(0, -20)
                }
            });
            
            viewer.flyTo(targetEntity, {
                duration: 2,
                offset: new Cesium.HeadingPitchRange(0, -Cesium.Math.PI_OVER_FOUR, 500000)
            });
        }
        
        // Initial view
        viewer.camera.flyTo({
            destination: Cesium.Cartesian3.fromDegrees(0, 20, 20000000),
            duration: 0
        });
    </script>
</body>
</html>
