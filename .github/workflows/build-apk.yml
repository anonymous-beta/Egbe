name: Build EGBE APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Gradle Wrapper (temporary)
        run: |
          # Download a modern Gradle distribution
          GRADLE_VERSION=8.2
          wget -q https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip -O gradle.zip
          unzip -q gradle.zip
          ./gradle-${GRADLE_VERSION}/bin/gradle wrapper --gradle-version ${GRADLE_VERSION}
          
          # Make sure it's executable
          chmod +x gradlew
          
          echo "=== Generated files ==="
          ls -la gradlew*
          ls -la gradle/wrapper/

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: egbe-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30